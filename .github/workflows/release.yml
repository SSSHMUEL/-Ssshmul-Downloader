name: Build and Release Ssshmul Downloader

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Version Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup Inno Setup
        uses: Irish-Dev/setup-inno-setup@v1

      - name: Determine Version
        id: get_version
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version_tag }}"
          }
          $cleanVer = $ver.TrimStart('v').TrimStart('V')
          if ([string]::IsNullOrWhiteSpace($cleanVer)) {
            $cleanVer = "1.0.0"
          }
          echo "VERSION=$cleanVer" >> $env:GITHUB_ENV
          echo "TAG_NAME=$ver" >> $env:GITHUB_ENV

      - name: Publish .NET WPF Project (Self-Contained x64)
        shell: pwsh
        run: |
          dotnet publish SsshmulDownloader/SsshmulDownloader.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -p:Version=${{ env.VERSION }}

      - name: Compile Inno Setup Installer
        shell: pwsh
        run: |
          iscc /DMyAppVersion=${{ env.VERSION }} SsshmulDownloader/installer.iss

      - name: Archive Chrome Extension
        shell: pwsh
        run: |
          Compress-Archive -Path extension/* -DestinationPath installer_output/SsshmulDownloader_ChromeExtension.zip -Force

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Ssshmul Downloader ${{ env.TAG_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            installer_output/SsshmulDownloader_Setup.exe
            installer_output/SsshmulDownloader_ChromeExtension.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
